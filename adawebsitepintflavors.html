  }

 /* TWO-COLUMN GRID: fills left to right, then down, so A-B is row 1, C-D is row 2 */
  .column {
    width: 100%;
    max-width: none;
    text-align: center;
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 32px;
    align-items: start;
  }

 /* ENTRY: one name + description pair */
  .entry {
    margin-bottom: 14px;
  }

  /* Very narrow phones: fall back to one column so names don't get squeezed */
  @media (max-width: 340px) {
    .column { grid-template-columns: 1fr; }
  }

  /* NAME: smaller pink Bubblegum Sans */
  .entry h2 {
    font-family: 'Bubblegum Sans', cursive;
    font-size: clamp(1.3rem, 3.5vw, 2rem);
    font-weight: normal;
    color: #a8325f; /* shop pink */
    margin: 0 0 2px;
  }

  /* DESCRIPTION: smaller dark gray text under each name */
  .entry p {
    font-family: 'SF Cartoonist Hand', 'Comic Sans MS', 'Comic Sans', 'Chalkboard SE', cursive;
    font-size: clamp(0.95rem, 0.8rem + 0.5vw, 1.2rem);
    color: #404040;
    margin: 0;
  }

  /* Very narrow phones: fall back to one column so names don't get squeezed */
  @media (max-width: 340px) {
    .column { column-count: 1; }
  }

</style>
